rootProject.name = 'login'

dependencyResolutionManagement.versionCatalogs {
    libs {
        library("dependencies", "com.mcst:easyfk-dependencies:3.2.12")
        library("moduleDependencies", "com.mcst:module-dependencies:3.2.12")
        library('lombok', 'org.projectlombok:lombok:1.18.38')
        library('lombokMapstruct', 'org.projectlombok:lombok-mapstruct-binding:0.2.0')
        library('mapstructProcessor', 'io.github.linpeilie:mapstruct-plus-processor:1.5.0')
        library('processor', 'org.springframework.boot:spring-boot-configuration-processor:3.2.12')
    }
}


include 'login-server'
include 'login-api'

include 'login-remote'
include 'login-remote:login-cloud-api'
findProject(':login-remote:login-cloud-api')?.name = 'login-cloud-api'
include 'login-remote:login-cloud-provider'
findProject(':login-remote:login-cloud-provider')?.name = 'login-cloud-provider'
include 'login-remote:login-dubbo-api'
findProject(':login-remote:login-dubbo-api')?.name = 'login-dubbo-api'
include 'login-remote:login-dubbo-provider'
findProject(':login-remote:login-dubbo-provider')?.name = 'login-dubbo-provider'

include 'login-prd'

include 'login-orm'
include 'login-orm:login-orm-api'
include 'login-orm:login-orm-flex'
include 'login-orm:login-orm-plus'
include 'login-orm:login-orm-hibernate'